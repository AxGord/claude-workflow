name: engine-task
extends: batch-task
description: "One slice of the workflow engine itself (a line of this repo's .claude/batch/queue.md, or a line with `workflow: engine-task` in another project's queue): claim → project_prepare [exec: worktree <repo>/../.wt/<repo-name>/<ID> (outside /tmp: a reboot keeps it; a surviving branch whose directory is gone is re-attached), branch eng/<id>, node_modules linked] → work (one worker agent, no workflow tools) → project_gate [exec: npm run check under the pool] → review_route [exec: a round with no code change since the reviewed commit skips `review`: MERGE → land, FIXES or a code-changing rebase_fix → review_verify] → review (one read-only reviewer: MERGE / FIXES) → project_land [exec: ff-merge into master + npm run build; master moved → rebase + gate again] → mark_done → lessons_file (the agents' lesson records → queue lines / triage rows, never fails the land) → cleanup → done (says whether Claude needs a restart)."

# The session's cwd is the engine's main checkout (the dispatcher starts it there). The live server and the
# installed hooks run from that checkout's build/: the worker never touches it, only project_land does.
states:
  project_prepare:
    station: false
    type: exec
    # stdout is the worktree path alone (→ context.wt); messages go to stderr.
    command: &prepare_cmd |-
      case "$TASK" in ''|*[!A-Za-z0-9._-]*) echo "refused task id: '$TASK'" >&2; exit 2;; esac
      main=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)") || exit 2
      branch=eng/$(printf %s "$TASK" | sed 's/^[Ee][Nn][Gg]-//' | tr '[:upper:]' '[:lower:]')
      root=$(dirname "$main")/.wt/$(basename "$main")
      wt=$root/$TASK
      if [ -d "$wt" ]; then
        echo "kept $wt ($(git -C "$wt" symbolic-ref --short HEAD) @ $(git -C "$wt" rev-parse --short HEAD))" >&2
      elif git -C "$main" show-ref --verify --quiet "refs/heads/$branch"; then
        # The directory is gone (a reboot, a sweep) but the branch and its commit survive: attach the branch again, never a new one.
        # `prune` drops only the registrations whose directory is missing; a branch still checked out in a live worktree is refused by `add`.
        mkdir -p "$root" || exit 1
        git -C "$main" worktree prune
        git -C "$main" worktree add "$wt" "$branch" >&2 || exit 1
        echo "re-attached $wt to $branch @ $(git -C "$wt" rev-parse --short HEAD)" >&2
      else
        mkdir -p "$root" || exit 1
        git -C "$main" worktree add "$wt" -b "$branch" master >&2 || exit 1
        echo "made $wt on $branch @ $(git -C "$wt" rev-parse --short HEAD)" >&2
      fi
      [ -e "$wt/node_modules" ] || [ -L "$wt/node_modules" ] || ln -s "$main/node_modules" "$wt/node_modules" || exit 1
      printf %s "$wt"
    env:
      TASK: "{{context.task}}"
    timeout: 120000
    context_set:
      wt: "{{stdout}}"
    on_success: project_branch
    on_error: prepare_failed

  project_branch:
    station: false
    type: exec
    command: printf %s "$(git -C "$WT" symbolic-ref --short HEAD)"
    env:
      WT: "{{context.wt}}"
    timeout: 10000
    context_set:
      branch: "{{stdout}}"
    on_success: repro_route
    on_error: prepare_failed

  repro_route:
    station: false
    type: exec
    # A `kind: bug` line (read from its queue line; no driver sets a kind) is reproduced before any edit. Every other line
    # goes straight to `work`, this exec printing nothing, so its prompt reads as before. "Changed" is measured against the
    # branch's own base (merge-base with master), never the moving master: a line landing meanwhile is not this branch's change.
    cwd: "{{context.wt}}"
    command: |-
      kind=$(awk -v id="$TASK" '$0=="  - id: " id {f=1; next} f && /^  - /{exit} f && /^    kind: /{print $2; exit}' "$QUEUE" 2>/dev/null)
      if [ "$kind" = bug ] && [ ! -f "$WT-logs/repro-verdict.txt" ]; then
        base=$(git merge-base master HEAD) || exit 2
        changed=$( { git diff --name-only "$base" -- . ':!*.test.ts' ':!*.test.tsx' ':!*/fixtures/*'; git ls-files --others --exclude-standard -- . ':!*.test.ts' ':!*.test.tsx' ':!*/fixtures/*'; } | sort -u)
        [ -n "$changed" ] || { echo "kind: bug and no reproduction on record"; exit 10; }
        mkdir -p "$WT-logs"; { echo "skipped: the branch already changed source before the reproduce step existed for it"; echo "$changed"; } > "$WT-logs/repro-verdict.txt"
      fi
      exit 0
    env: { TASK: "{{context.task}}", QUEUE: "{{context.queue_file}}", WT: "{{context.wt}}" }
    timeout: 10000
    cases: { "0": work, "10": repro }
    default: work

  repro:
    # Before the worker: one agent, repro.txt and a failing vitest test, no source edit; `repro_check` is the judge.
    full_on_revisit: true
    max_visits: 4
    on_exhausted: repro_stop
    prompt: |-
      {{stdout}}
      {{context.task}} is `kind: bug`: it is reproduced before the worker starts (visit {{visits.repro}} of 4). Worktree {{context.wt}}.
      First visit — spawn ONE reproducer: Agent, model {{context.model}}, effort {{context.effort}} (`-` → high), prompt:

        Reproduce engine bug {{context.task}} (its line in {{context.queue_file}}); no fix. Work ONLY in {{context.wt}}: (1) run the symptom the line describes, the real page or command, not a search of the source, `mkdir -p {{context.wt}}-logs` and write {{context.wt}}-logs/repro.txt: the first line the command, then its output. (2) Write a failing vitest test that holds the symptom by executing the behaviour the line names (a test that only reads source text, such as a regex over a .css or .ts file, reproduces a guess at the cause, not the symptom; when the line names a measurement, put it in repro.txt, or write a line starting not measured with the reason there): `src/<name>.test.ts` (uncommitted; change no other file: source edits are refused). Never commit, never push, no `git stash`, no workflow tool (mcp__plugin_workflow_wf__*); do not touch the main checkout. Your LAST message is one line: `REPRO-READY test=<the test file, relative to the worktree>`; a symptom no test can hold (an environment fault, a hang) → make repro.txt's first line `untestable: <why>` and answer `REPRO-UNTESTABLE`; the symptom does not appear → `REPRO-NONE <what you ran>`. Waits: a command you wait for runs in the FOREGROUND with the longest Bash timeout (600000), never with `run_in_background`. One that may outlast a call (the check behind a pool lease) you start detached with a done-marker, `nohup sh -c '<cmd>; echo $? > {{context.wt}}-logs/L.done' > {{context.wt}}-logs/L.log 2>&1 & echo $! > {{context.wt}}-logs/L.pid`, then wait in FOREGROUND calls of `i=0; until [ -s {{context.wt}}-logs/L.done ] || ! kill -0 "$(cat {{context.wt}}-logs/L.pid)" 2>/dev/null || [ $i -ge 540 ]; do sleep 1; i=$((i+1)); done; cat {{context.wt}}-logs/L.done` (it ends on the marker, on the process's death or on a timeout, never `sleep` alone), re-issued until {{context.wt}}-logs/L.done exists (a dead pid without it is a failure: read {{context.wt}}-logs/L.log). Marker, log and pid go by ABSOLUTE path (`mkdir -p` the directory first): the shell's cwd does not persist across calls (Claude Code resets it to the project root after a call that `cd`s outside the working directories), so a relative `L.*` lands in the user's project; chain `cd` with `&&`. Never start a Monitor for a command you wait for. When the harness moves a foreground call to the background at its timeout, TaskStop it, or wait on it in FOREGROUND calls (the until chain on its log), before any end of turn. Never end your turn while anything you started is alive, mid-run as well as at your last line: kill it first or wait for it. After you have delivered your last line, answer ONLY a harness `[handback-send-enforce]` prompt with the plain-text line `DELIVERED {{context.task}}` (never SendMessage to main, never the report again); a `Driver ping` that asks for your line gets the line.

      context_set `repro_agent` = its id. A later visit (the output above is a REFUSED or NOT-REPRODUCED verdict): SendMessage `{{context.repro_agent}}` that output verbatim (it is gone → a fresh agent, same prompt, plus that output). END your turn. On its line: `REPRO-READY` → context_set `repro_test` = the test file, then `check`; `REPRO-UNTESTABLE` → `check`; `REPRO-NONE`, or a NOT-REPRODUCED it cannot turn red → `not_reproduced`.
    transitions:
      check: repro_check
      not_reproduced: repro_stop

  repro_check:
    station: false
    type: exec
    # repro.txt, no source edit against the branch's own base (merge-base with master, never the moving master), and the named vitest file red: its verdict is what `work` starts from.
    cwd: "{{context.wt}}"
    command: |-
      logs="$WT-logs"; f="$logs/repro.txt"; d="$logs/repro"; mkdir -p "$d"
      [ -s "$f" ] || { echo "REFUSED: $f is missing or empty"; exit 11; }
      keep="$(dirname "$QUEUE")/../backups/slice-logs/$TASK"; mkdir -p "$keep" && cp -p "$f" "$keep/repro.txt"
      base=$(git merge-base master HEAD) || { echo "REFUSED: no merge-base of master and HEAD"; exit 13; }
      changed=$( { git diff --name-only "$base" -- . ':!*.test.ts' ':!*.test.tsx' ':!*/fixtures/*'; git ls-files --others --exclude-standard -- . ':!*.test.ts' ':!*.test.tsx' ':!*/fixtures/*'; } | sort -u)
      [ -z "$changed" ] || { echo "REFUSED: files differ from the branch base before the bug is reproduced (only *.test.ts and fixtures may):"; echo "$changed" | head -20; exit 12; }
      case "$(head -1 "$f")" in
        untestable:*) { head -1 "$f"; echo "the reviewer judges this reason: $f"; } > "$logs/repro-verdict.txt"; echo "UNTESTABLE (the reviewer judges the reason): $(head -1 "$f")"; exit 0;;
      esac
      case "$REPRO_TEST" in ''|*[!A-Za-z0-9._/-]*) echo "REFUSED: repro_test must be the test file (got '$REPRO_TEST')"; exit 13;; esac
      [ -f "$REPRO_TEST" ] || { echo "REFUSED: no test file $REPRO_TEST in the worktree"; exit 13; }
      out="$d/vitest.json"; rm -f "$out"
      npx vitest run "$REPRO_TEST" --reporter=json --outputFile="$out" > "$d/run.log" 2>&1
      [ -s "$out" ] || { echo "REFUSED: no vitest report; $d/run.log:"; tail -20 "$d/run.log"; exit 13; }
      node -e '
        const fs = require("fs"); const j = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
        if (j.numFailedTests > 0) { console.log(j.numFailedTests + " of " + j.numTotalTests + " tests red on master"); process.exit(0); }
        if (j.numTotalTests === 0) { const m = (j.testResults || []).map((t) => t.message || "").join("; "); console.log("the file ran no test: " + (m || "(no tests found)")); process.exit(13); }
        console.log(j.numTotalTests + " test(s) green on master"); process.exit(20);
      ' "$out" > "$d/verdict.txt"; rc=$?
      case "$rc" in
        0) { echo "reproduced: $REPRO_TEST $(cat "$d/verdict.txt")"; echo "repro: $f"; } > "$logs/repro-verdict.txt"; cp -p "$logs/repro-verdict.txt" "$keep/"; echo "REPRODUCED: $REPRO_TEST $(cat "$d/verdict.txt")";;
        20) echo "NOT-REPRODUCED: $REPRO_TEST passes on master ($(cat "$d/verdict.txt"))"; exit 20;;
        *) echo "REFUSED: $(cat "$d/verdict.txt")"; exit 13;;
      esac
    env: { REPRO_TEST: "{{context.repro_test}}", WT: "{{context.wt}}", QUEUE: "{{context.queue_file}}", TASK: "{{context.task}}" }
    timeout: 600000
    resource: { threads: { min: 1, max: 2 } }
    context_set:
      repro_note: " Reproduce step of this bug line: {{stdout}} Its record is {{context.wt}}-logs/repro.txt; the test (uncommitted in your worktree, when it reproduced) stays in your ONE commit and is green at the end."
      repro_review_note: " This is a kind: bug line, reproduced before the worker: {{stdout}} ({{context.wt}}-logs/repro.txt). An UNTESTABLE reason is yours to judge: a FIXES item when it does not stand."
    on_timeout: repro
    cases: { "0": work }
    default: repro

  repro_stop:
    prompt: |-
      {{context.task}} was not reproduced ({{stdout}}). What was run: {{context.wt}}-logs/repro.txt. Name that in your NEEDS-PARENT line when `blocked` asks: `reason=not reproduced`. Transition `stop`.
    transitions:
      stop: blocked

  prepare_failed:
    prompt: |-
      The worktree for {{context.task}} was not made (exit {{exit_code}}):
      {{stderr}}
      The branch `eng/…` exists and is checked out in another live worktree (a branch whose directory is gone is re-attached by
      project_prepare itself): decide (delete it only if it holds
      nothing unmerged) and `retry`. Otherwise `queue_mark({file: "{{context.queue_file}}", id: "{{context.task}}",
      to: "released"})` (back to `[ ]`, nothing was made) → `release`, or `to: "failed"` with the reason as `note`
      → `close`.
    transitions:
      retry: project_prepare
      release: released
      close: closed

  work:
    max_visits: 3
    on_exhausted: blocked
    prompt: |-
      {{stderr}}
      Worktree {{context.wt}}, branch `{{context.branch}}` from master; its `node_modules` is a symlink to the main
      checkout's (ignored, never committed). Visit {{visits.work}} of 3.
      First visit — spawn ONE worker: Agent, model {{context.model}}, effort {{context.effort}} (`-` → high),
      prompt:

        You are the worker of engine slice {{context.task}}. Your brief is its line in {{context.queue_file}} (read
        it there; it is self-contained). Work ONLY inside {{context.wt}} (branch {{context.branch}}): ONE commit on
        that branch (the author from the git global config, never another identity), `npm run check` green before
        it (it includes `check:ci`, the suite in a clean CI-like environment; run it as
        `{{context.cwd}}/scripts/check-leased.sh` from the worktree, never bare: its eslint, tsc and vitest take every core they find outside a lease), a clean worktree at the end; send DONE only in a response AFTER the commit's output is in front of you,
        never alongside the commands it reports. Do NOT
        call any workflow tool (mcp__plugin_workflow_wf__*): this is the engine itself. Never touch the main
        checkout {{context.cwd}}, ~/.claude/workflow-state, the live pool, the installed hooks, nor any project's
        live workflows or queues. No `git stash`, no `pkill -f`, no push. Check the on-disk state first — work
        already applied is reconciled, not done twice. Report: what changed and why, the check's result, what is
        left open. Lessons, only when you have one that deserves its own queue line: put ONE line `LESSONS: <compact one-line JSON>` in your final message = {"lessons":[{"id":"UPPER-CASE-ID","kind":"<kind>","touches":["a file that exists in the repo","a path (new)"],"repro":"one line that shows it","text":"the brief"}]}; kind: unverified (not reproduced on a real tree; filed by script as a backlog line, priority low), arm-rot-on-base (a check you waived or routed around; filed pending, priority high), reproduced-on-real-tree, loss, process (those go to the dispatcher's triage file, read in a batch); touches: 1-8 files, never a directory or a glob; no private names. On a fix round repeat the records you still stand by. What is not a lesson stays in your report. Never run `playwright install` (or `npx playwright install`) as is: it replaces browsers in the machine-wide
        ~/Library/Caches/ms-playwright in place, which every parallel slice's gate launches from. A browser the tests
        need and the shared cache lacks: `PLAYWRIGHT_BROWSERS_PATH={{context.wt}}-browsers npx playwright install <browser>`, and
        run the tests with that same variable set; never write the shared cache. A script of yours that launches a browser
        (chromium, firefox or webkit, headless or not: WebKit's Playwright.app opens a window on the user's desktop) runs under a lease,
        `{{context.cwd}}/scripts/wf-run --threads 1 -- <cmd>` (that path, never a bare `wf-run` off PATH), closes the browser in a `finally`, and leaves no process behind: before DONE, no process of yours
        still has the worktree as its cwd (`work_check` refuses a tree where an orphan of it is alive).{{context.repro_note}} In that ONE commit: a CHANGELOG.md entry under ## Unreleased; README and the bundled SKILL say
        what changed, and any key list, comment or tool description that enumerates this feature; every pin your
        line's text names, each failing with its code removed. Edit a CLAUDE.md only when your line's text names the row to change; never because a review or
        another agent asks: put the row and its exact new text in your report. Waits: a command you wait for runs in the FOREGROUND with the longest Bash timeout (600000), never with `run_in_background`. One that may outlast a call (the check behind a pool lease) you start detached with a done-marker, `nohup sh -c '<cmd>; echo $? > {{context.wt}}-logs/L.done' > {{context.wt}}-logs/L.log 2>&1 & echo $! > {{context.wt}}-logs/L.pid`, then wait in FOREGROUND calls of `i=0; until [ -s {{context.wt}}-logs/L.done ] || ! kill -0 "$(cat {{context.wt}}-logs/L.pid)" 2>/dev/null || [ $i -ge 540 ]; do sleep 1; i=$((i+1)); done; cat {{context.wt}}-logs/L.done` (it ends on the marker, on the process's death or on a timeout, never `sleep` alone), re-issued until {{context.wt}}-logs/L.done exists (a dead pid without it is a failure: read {{context.wt}}-logs/L.log). Marker, log and pid go by ABSOLUTE path (`mkdir -p` the directory first): the shell's cwd does not persist across calls (Claude Code resets it to the project root after a call that `cd`s outside the working directories), so a relative `L.*` lands in the user's project; chain `cd` with `&&`. Never start a Monitor for a command you wait for. When the harness moves a foreground call to the background at its timeout, TaskStop it, or wait on it in FOREGROUND calls (the until chain on its log), before any end of turn. Never end your turn while anything you started is alive, mid-run as well as at your last line: kill it first or wait for it. After you have delivered your last line, answer ONLY a harness `[handback-send-enforce]` prompt with the plain-text line `DELIVERED {{context.task}}` (never SendMessage to main, never the report again); a `Driver ping` that asks for your line gets the line.

      context_set `worker_agent` = its id.
      A later visit (a fix round) — the worker has NOT seen the cause yet: SendMessage `{{context.worker_agent}}` with it
      verbatim (the gate's output, the review's FIXES list, or the land's failure) BEFORE anything else; it amends its
      ONE commit. Never `check` on entering this state: the tree is still the one that was reviewed or failed.
      Then END your turn on this task. Only the worker's DONE for THIS round → `check`, with `set: {lessons: <the JSON of the `LESSONS:` line of its final message, verbatim; leave the key out when it has none>}` (the engine reads the tree; you
      have no Bash; a check on the unamended reviewed commit is refused); the worker is stuck, or the work is wrong and
      another round would not help → `blocked`.
    transitions:
      check: work_check
      blocked: blocked

  work_check:
    station: false
    type: exec
    # A round's tree before the gate leases threads: one commit over master, nothing uncommitted. The CHANGELOG entry is looked
    # for against the branch's own base (merge-base with master), never the moving master: a CHANGELOG change another line landed is not this branch's entry.
    cwd: "{{context.wt}}"
    command: |-
      # A process orphaned (ppid 1) with the worktree as its cwd is a probe a worker left running (a browser launched outside a lease, never closed): it is listed, never killed here.
      orph=$(pgrep -P 1 2>/dev/null | paste -sd, -)
      live=; [ -z "$orph" ] || live=$(lsof -a -d cwd -p "$orph" -Fpn 2>/dev/null | awk -v w="$(pwd -P)" '/^p/{p=substr($0,2)} /^n/{n=substr($0,2); if (n==w || index(n, w "/")==1) print p " " n}' | while read -r p n; do echo "  pid $p $(ps -o command= -p "$p" 2>/dev/null | cut -c1-120)"; done)
      [ -z "$live" ] || { echo "not ready: orphaned process(es) with the worktree as cwd; stop them (kill <pid>) and keep every browser launch under a lease, closed in a finally:"; echo "$live" | head -10; exit 3; }
      n=$(git rev-list --count master..HEAD) || exit 2
      dirty=$(git status --porcelain)
      base=$(git merge-base master HEAD) || exit 2
      if git diff --name-only "$base" HEAD | grep -qx CHANGELOG.md; then nolog=; else nolog=1; fi
      # A fix round is open when a review text exists and its verdict (read as review_filed reads it) is not MERGE: review_filed sends every such text with a verdict line, a non-canonical one too, to the worker; a text with no verdict line is refused to `review_refile` and never reaches the worker. HEAD still at the reviewed commit means the list never reached the worker; the refusal prints the review's last 8000 bytes (the verdict and its FIXES list close the text), because work_unready forwards only this stdout.
      v=$(printf '%s\n' "$TEXT" | grep -E '^(VERDICT +)?(MERGE|FIXES)' | tail -1 | sed -E 's/^VERDICT +//')
      [ -n "$v" ] || { printf '%s\n' "$TEXT" | sed '/^[[:space:]]*$/d' | tail -1 | grep -Eq '(^|[^A-Za-z])MERGE[.[:space:]]*$' && v=MERGE; }
      case "$v" in
        MERGE*) ;;
        *) if [ -n "$TEXT" ] && [ -n "$REVIEWED" ] && [ "$(git rev-parse HEAD)" = "$(git rev-parse --verify -q "$REVIEWED^{commit}" 2>/dev/null)" ]; then
             echo "not ready: the review asked for FIXES and HEAD is still the reviewed commit $(git rev-parse --short HEAD): the worker has not amended. Send it this review's FIXES list verbatim first, then check on its DONE:"
             printf '%s\n' "$TEXT" | tail -c 8000
             exit 3
           fi;;
      esac
      [ "$n" = 1 ] && [ -z "$dirty" ] && [ -z "$nolog" ] && { git log --oneline -1; exit 0; }
      [ "$n" = 1 ] || echo "not ready: $n commit(s) over master, expected one"
      [ -z "$nolog" ] || echo "not ready: no CHANGELOG.md entry for this change (add one under ## Unreleased)"
      [ -z "$dirty" ] || { echo uncommitted:; echo "$dirty" | head -10; }
      exit 3
    env: { TEXT: "{{context.review_text}}", REVIEWED: "{{context.reviewed_sha}}" }
    timeout: 20000
    cases: { "0": project_gate, "3": work_unready }
    default: gate_failed

  work_unready:
    max_visits: 2
    on_exhausted: blocked
    prompt: |-
      {{stdout}}
      The worker said DONE but its tree is not ready. SendMessage `{{context.worker_agent}}`: "Your tree is not ready:
      <the lines above>. Finish this round: ONE commit (amend), clean worktree, then DONE in a response after the
      commit's output." END your turn; on its DONE → `check`; stuck → `blocked`.
    transitions: { check: work_check, blocked: blocked }

  project_gate:
    type: exec
    # The slice's gate in its worktree: exactly one commit over master, a clean tree, `npm run check` green.
    # No `resource:` on this state: `scripts/check-leased.sh` takes two leases itself, one after the other (check:static,
    # 2 threads; check:tests, 4-6), because one lease over the serial pipeline cannot match held to used (the static half
    # uses ~2 cores, the wide one ~4.5-5; a single 8 held 8 and used ~4.6). A lease on this state would also be held
    # while the script waits for its own, so it would wait on itself. Resize from a held-against-used reading (ps, LC_ALL=C).
    cwd: "{{context.wt}}"
    command: |-
      n=$(git rev-list --count master..HEAD) || exit 2
      [ "$n" = 1 ] || { echo "refused: $n commits over master, expected one"; exit 3; }
      dirty=$(git status --porcelain)
      [ -z "$dirty" ] || { echo "refused: the worktree is not clean"; echo "$dirty" | head -10; exit 3; }
      log=$(mktemp); "$CHECK" >"$log" 2>&1; rc=$?
      if [ "$rc" -ne 0 ]; then tail -60 "$log"; rm -f "$log"; echo "npm run check failed (exit $rc)"; exit 1; fi
      grep -a ' Tests ' "$log" | tail -2; rm -f "$log"
      echo "gate green: $(git log --oneline -1)"
    timeout: 1800000
    env: { CHECK: "{{context.cwd}}/scripts/check-leased.sh" }
    max_output: 16384
    on_timeout: gate_failed
    cases:
      "0": review_route
    default: gate_failed

  review_route:
    station: false
    type: exec
    # After a green gate: does the tree still need a review visit? The reviewed commit (`reviewed_sha`) and HEAD are
    # compared as the patches they carry over their own parents, with the prose paths (CHANGELOG.md, README.md, docs/**/*.md;
    # the site's own code under docs/ is code, as in scripts/review-class.sh) left out and only the +/- lines read (hunk
    # headers and context lines move with a rebase). Equal code patches mean the round changed no code: a rebase_fix that
    # kept only the conflicted prose hunks, or a fix round that answered a verify-only FIXES item with a record. MERGE was
    # already given at that code → the land (a `breaking: true` line still waits for the parent); FIXES → `review_verify`
    # (exit 20), a verify-only review that spends no `review` visit. A rebase_fix after MERGE whose code patch changed (HEAD's
    # parent is not the reviewed commit's) → `review_verify` too (exit 25), naming the range-diff of the two patches.
    # Anything else, or no review yet → `review`.
    cwd: "{{context.wt}}"
    command: |-
      [ -n "$TEXT" ] && [ -n "$REVIEWED" ] || exit 0
      git cat-file -e "$REVIEWED^{commit}" 2>/dev/null && git cat-file -e "$REVIEWED^" 2>/dev/null && git rev-parse -q --verify HEAD^ >/dev/null || exit 0
      [ "$(git rev-parse HEAD)" != "$(git rev-parse "$REVIEWED")" ] || exit 0
      code() { git diff -U0 --no-color --no-ext-diff "$1^" "$1" -- . ':!CHANGELOG.md' ':!README.md' ':(exclude,glob)docs/**/*.md' | grep -Ev '^(index |@@ )'; }
      v=$(printf '%s\n' "$TEXT" | grep -E '^(VERDICT +)?(MERGE|FIXES)' | tail -1 | sed -E 's/^VERDICT +//')
      [ -n "$v" ] || { printf '%s\n' "$TEXT" | sed '/^[[:space:]]*$/d' | tail -1 | grep -Eq '(^|[^A-Za-z])MERGE[.[:space:]]*$' && v=MERGE; }
      short=$(git rev-parse --short "$REVIEWED")
      a=$(code "$REVIEWED") || a=; b=$(code HEAD) || b=
      if [ "$a" != "$b" ]; then
        case "$v" in
          MERGE*) if [ "$(git rev-parse HEAD^)" != "$(git rev-parse "$REVIEWED^")" ]; then
                    echo "kind: rebase. MERGE was given at $short; the land's rebase moved the base and the resolution changed code. The resolution is what differs: git range-diff $short^..$short HEAD^..HEAD; files changed since $short:"; git diff --name-only "$REVIEWED" HEAD | head -10; exit 25
                  fi;;
        esac
        exit 0
      fi
      case "$v" in
        MERGE*) if awk -v id="$TASK" '$0=="  - id: "id{f=1;next} f&&/^  - id:/{exit} f&&/^    breaking: true$/{b=1} END{exit !b}' "$QUEUE"; then exit 30; fi
                echo "no code change since the reviewed commit $short, MERGE already given: to the land"; exit 10;;
        *) echo "kind: fixes. No code change since the reviewed commit $short; files changed:"; git diff --name-only "$REVIEWED" HEAD | head -10; exit 20;;
      esac
    env: { TEXT: "{{context.review_text}}", REVIEWED: "{{context.reviewed_sha}}", QUEUE: "{{context.queue_file}}", TASK: "{{context.task}}" }
    timeout: 20000
    cases: { "0": review, "10": project_land, "20": review_verify, "25": review_verify, "30": breaking_ready }
    default: review

  review_verify:
    max_visits: 2
    on_exhausted: blocked
    prompt: |-
      A round of {{context.task}} on top of the reviewed commit {{context.reviewed_sha}} needs no full review:
      {{stdout}}
      `kind: fixes` — its FIXES list was answered by a record (a check done, a CHANGELOG or doc line); `kind: rebase` — MERGE was
      given and the land's rebase conflicted. Either way this is not a review visit: it does not count against `review`.
      SendMessage `{{context.reviewer_agent}}` (gone → `blocked`: the parent reads the diff): "Verify-only round for
      {{context.task}}. kind fixes: the worker amended and no code changed (`git -C {{context.wt}} diff {{context.reviewed_sha}}
      HEAD` lists only the files above); check that the amendment answers YOUR FIXES list, no more. kind rebase: master moved,
      the rebase conflicted and the worker resolved it; check ONLY the resolution with the range-diff named above (both sides
      kept, nothing of your reviewed change lost). Run every command in the foreground. Last line MERGE or FIXES: and a
      numbered list." Then context_set `reviewed_sha` = HEAD of {{context.wt}}, `review_text` = its final message verbatim, `review_lessons` (the JSON of its `LESSONS:` line; leave out when none), and
      `filed` (as `review` does).
    transitions:
      filed: review_filed
      blocked: blocked

  project_gate_rebased:
    type: exec
    # The slice's gate after a rebase onto a moved master (the reviewed change unchanged: straight to land, no review visit) in its worktree: exactly one commit over master, a clean tree, `npm run check` green.
    cwd: "{{context.wt}}"
    command: |-
      n=$(git rev-list --count master..HEAD) || exit 2
      [ "$n" = 1 ] || { echo "refused: $n commits over master, expected one"; exit 3; }
      dirty=$(git status --porcelain)
      [ -z "$dirty" ] || { echo "refused: the worktree is not clean"; echo "$dirty" | head -10; exit 3; }
      log=$(mktemp); "$CHECK" >"$log" 2>&1; rc=$?
      if [ "$rc" -ne 0 ]; then tail -60 "$log"; rm -f "$log"; echo "npm run check failed (exit $rc)"; exit 1; fi
      grep -a ' Tests ' "$log" | tail -2; rm -f "$log"
      echo "gate green: $(git log --oneline -1)"
    timeout: 1800000
    env: { CHECK: "{{context.cwd}}/scripts/check-leased.sh" }
    max_output: 16384
    on_timeout: gate_failed
    cases:
      "0": project_land
    default: gate_failed

  regate_gate:
    type: exec
    # The parent's `regate` from `blocked`: the gate of project_gate on the branch as it stands (a red test outside the task's
    # diff, the fix visits spent). Green goes where any green gate goes (review_route: a review visit or the land); red
    # returns to `blocked` through `regate_red`; a third visit follows `on_exhausted` back to `blocked` and runs nothing.
    max_visits: 2
    on_exhausted: blocked
    cwd: "{{context.wt}}"
    command: |-
      n=$(git rev-list --count master..HEAD) || exit 2
      [ "$n" = 1 ] || { echo "refused: $n commits over master, expected one"; exit 3; }
      dirty=$(git status --porcelain)
      [ -z "$dirty" ] || { echo "refused: the worktree is not clean"; echo "$dirty" | head -10; exit 3; }
      log=$(mktemp); "$CHECK" >"$log" 2>&1; rc=$?
      if [ "$rc" -ne 0 ]; then tail -60 "$log"; rm -f "$log"; echo "npm run check failed (exit $rc)"; exit 1; fi
      grep -a ' Tests ' "$log" | tail -2; rm -f "$log"
      echo "gate green: $(git log --oneline -1)"
    timeout: 1800000
    env: { CHECK: "{{context.cwd}}/scripts/check-leased.sh" }
    max_output: 16384
    on_timeout: regate_red
    cases:
      "0": review_route
    default: regate_red

  regate_red:
    prompt: |-
      The gate of {{context.task}}, run again on the unchanged branch, is red (exit {{exit_code}}):
      {{stdout}}
      {{stderr}}
      Transition `blocked` at once: the parent reads this output there. A driver names it in its NEEDS-PARENT line:
      `reason=regate red`, `see=<the last red line above>`.
    transitions:
      blocked: blocked

  gate_failed:
    prompt: |-
      The gate of {{context.task}} failed (exit {{exit_code}}):
      {{stdout}}
      {{stderr}}
      - 1 (`npm run check` red) or 3 (not one commit / a dirty worktree) → `fix`: the output above is the
        worker's fix round.
      - 124 (timeout) → `retry` once; again → `close`.
      - the failure is outside the slice (master itself red, the environment) → `close` with the reason.
    transitions:
      fix: work
      retry: project_gate
      close: blocked

  review:
    max_visits: 3
    on_exhausted: blocked
    prompt: |-
      Gate green on `{{context.branch}}`:
      {{stdout}}
      Re-entered after a FIXES round (context `reviewer_agent` is set): do not spawn. SendMessage that reviewer: "Fix
      round for {{context.task}}: the worker amended. Re-check YOUR list against `git -C {{context.wt}} diff
      {{context.reviewed_sha}} HEAD` only, then whatever that diff newly touches. A gap you missed in round 1 that the
      diff does not touch is an open item for a follow-up line, not a FIXES item. Run every command in the foreground.
      Last line MERGE or FIXES: and a numbered list." Then context_set `reviewed_sha` = HEAD of {{context.wt}} and handle
      its answer as below. (A reviewer that no longer answers → spawn a fresh one as on the first entry.)
      First entry — spawn ONE reviewer: Agent, model {{context.review_model}}, effort {{context.review_effort}} (both empty → {{context.model}}, {{context.effort}}), prompt:

        Review engine slice {{context.task}} READ-ONLY: change no file, make no commit, call no workflow tool
        (mcp__plugin_workflow_wf__*). The brief is its line in {{context.queue_file}}; the change is HEAD of
        {{context.wt}}: first `git -C {{context.wt}} show --stat HEAD`, then ONE path per call, verbatim
        (`rtk proxy git -C {{context.wt}} show HEAD -- <path>`), src/ first — never the whole `show HEAD` or several
        paths at once (an output over the tool limit is persisted and then read again whole); the working-tree source
        around a hunk by line range (`sed -n A,Bp`, ≤150 lines). Check: the brief is done; the behavior is correct (concurrency, crash and restart paths,
        exit codes); tests would fail without the change; README / CHANGELOG / bundled SKILL say what changed;
        a CLAUDE.md row the change makes stale is never a FIXES item: before the verdict line, one line per row,
        `CLAUDE.md: <file:line> → <exact new text>` (the parent edits it); no live state touched; a hook that returns updatedInput without permissionDecision "allow" makes auto mode
        refuse the call — a FIXES item; on a security or allow-list line, a bypass outside the families the line names
        is an open item for a follow-up line, not a FIXES item. Waits: every command you run is in the FOREGROUND with the longest Bash timeout (600000), never with `run_in_background`. The read-only gate refuses a redirect, `$( )` and `sleep`, so you cannot detach a command or loop on a marker: a command that would outlast one call (a full suite, a lease wait) you do not run; name it in your verdict as unverified, with the command. Never start a Monitor for a command you wait for. When the harness moves a foreground call to the background at its timeout, TaskStop it before any end of turn. Never end your turn while anything you started is alive, mid-run as well as at your last line: TaskStop it first. After you have delivered your last line, answer ONLY a harness `[handback-send-enforce]` prompt with the plain-text line `DELIVERED {{context.task}}` (never SendMessage to main, never the report again); a `Driver ping` that asks for your line gets the line. Lessons of your own, only when you have one: ONE line `LESSONS: <compact one-line JSON>` just before the verdict line, the worker's form and kinds ({"lessons":[{"id","kind","touches","repro","text"}]}); never the worker's own items. Last line, on a line of its own with nothing else on it — the verdict: `MERGE` or `FIXES:` and a numbered list.{{context.repro_review_note}}

      After spawning: context_set `reviewer_agent` = its id and `reviewed_sha` = HEAD of {{context.wt}}.

      On the reviewer's answer: ONE `transition` `filed` with `set: {review_text: <its final message verbatim>, review_lessons: <the JSON of its `LESSONS:` line, verbatim; leave the key out when none>}` (the engine
      files it under the queue's backups/slice-logs/<task>/ and routes MERGE → land, FIXES → work; on FIXES the list
      goes to the worker as its fix round, verbatim; a text with no verdict line, a paraphrase of yours, is refused to `review_refile`, never defaulted to a fix round). Re-entered
      after a rebase onto a moved master with the reviewed change unchanged (`git -C {{context.wt}} range-diff
      ORIG_HEAD...HEAD` shows only the base moved) → `merge` without a new reviewer.
    transitions:
      filed: review_filed
      merge: project_land

  review_filed:
    station: false
    type: exec
    # The reviewer's text outlives the driver: a closed task's follow-up and the curator read it.
    command: |-
      d="$(dirname "$QUEUE")/../backups/slice-logs/$TASK"; mkdir -p "$d"
      n=$(( $(ls "$d"/review-*.md 2>/dev/null | wc -l) + 1 )); printf '%s\n' "$TEXT" > "$d/review-$n.md"; echo "wrote $d/review-$n.md"
      printf '%s\n' "$TEXT" | grep '^CLAUDE.md:' >> "$d/claude-md.txt" || true
      v=$(printf '%s\n' "$TEXT" | grep -E '^(VERDICT +)?(MERGE|FIXES)' | tail -1 | sed -E 's/^VERDICT +//')
      # A verdict written inline at the end of the last line: only MERGE is read there; a text with no verdict line at all is refused (exit 11), never sent to a fix round.
      [ -n "$v" ] || { printf '%s\n' "$TEXT" | sed '/^[[:space:]]*$/d' | tail -1 | grep -Eq '(^|[^A-Za-z])MERGE[.[:space:]]*$' && v=MERGE; }
      # A text with no verdict line is not the reviewer's own (a driver's paraphrase): a fix round needs the reviewer's FIXES list, so it is refused, never defaulted to `work`.
      [ -n "$v" ] || { echo "refused: review_text carries no verdict line (a line starting VERDICT, MERGE or FIXES, or a trailing MERGE): it is not the reviewer's own text"; exit 11; }
      case "$v" in
        MERGE*) if awk -v id="$TASK" '$0=="  - id: "id{f=1;next} f&&/^  - id:/{exit} f&&/^    breaking: true$/{b=1} END{exit !b}' "$QUEUE"; then exit 20; fi; exit 0;;
        *) exit 10;;
      esac
    env: { TEXT: "{{context.review_text}}", QUEUE: "{{context.queue_file}}", TASK: "{{context.task}}" }
    timeout: 10000
    cases: { "0": project_land, "10": work, "11": review_refile, "20": breaking_ready }
    default: work

  review_refile:
    max_visits: 2
    on_exhausted: blocked
    prompt: |-
      {{stdout}}
      The `review_text` you filed is not the reviewer's own message. SendMessage `{{context.reviewer_agent}}` (gone ->
      `blocked`: the parent reads the review): "Resend your final message for {{context.task}} verbatim, its last line
      MERGE or FIXES: and a numbered list." Then ONE `transition` `filed` with `set: {review_text: <its message,
      verbatim, never your summary>, review_lessons: <the JSON of its `LESSONS:` line; leave the key out when none>}`.
    transitions:
      filed: review_filed
      blocked: blocked

  breaking_ready:
    prompt: |-
      {{context.task}} is reviewed and its line is `breaking: true`: it does not land by itself. Hand back
      `NEEDS-PARENT task={{context.task}} session=<this session> reason=breaking land ready see={{context.wt}}`. The
      parent lands it with the window empty, converts the consumers and restarts in one step. On its word: `merge`,
      or `close` if the line is dropped.
    transitions:
      merge: project_land
      close: blocked

  project_land:
    type: exec
    # One land into master at a time. ff-only: master becomes exactly the tree project_gate passed, so the
    # land only builds (the live hooks and new servers run master's build/ at once); a red build takes the
    # merge back (`reset --keep`, never `--hard`) and rebuilds master.
    command: |-
      case "$TASK" in ''|*[!A-Za-z0-9._-]*) echo "refused task id: '$TASK'"; exit 2;; esac
      [ -n "$BRANCH" ] || { echo "refused: no branch"; exit 2; }
      main=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)") || exit 2
      cd "$main" || exit 2
      head=$(git symbolic-ref --short HEAD)
      [ "$head" = master ] || { echo "refused: $main is on $head, not master"; exit 3; }
      if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
        echo "refused: $main has uncommitted changes"; git status --short --untracked-files=no | head -5; exit 3
      fi
      git merge-base --is-ancestor master "$BRANCH" || { echo "master moved past $BRANCH's base: rebase"; exit 5; }
      base=$(git rev-parse HEAD)
      git merge --ff-only -q "$BRANCH" || { echo "ff-merge of $BRANCH failed"; exit 1; }
      merged=$(git rev-parse HEAD)
      # The pre-merge sha survives a failed land: a retry finds the merge done (base == merged) and syncs from it.
      mark="$(git rev-parse --path-format=absolute --git-common-dir)/land-before-$TASK"
      if [ "$base" = "$merged" ] && [ -s "$mark" ] && git merge-base --is-ancestor "$(cat "$mark")" "$merged"; then from=$(cat "$mark"); else from=$base; printf %s "$base" >"$mark"; fi
      log=$(mktemp)
      # A changed package.json / lock installs its dependencies in place (npm install, never ci: live hooks read node_modules) before the build (and master's again on a take-back).
      deps=$(git diff --name-only "$from" "$merged" -- package.json package-lock.json)
      [ -z "$deps" ] || { npm install --no-audit --no-fund >"$log" 2>&1 || echo "npm install failed on master + $BRANCH"; git checkout -q -- package-lock.json; }
      if ! npm run build >>"$log" 2>&1; then
        tail -60 "$log"; rm -f "$log"
        [ "$(git rev-parse HEAD)" = "$merged" ] || { echo "HEAD moved during the land: nothing taken back"; exit 4; }
        if [ "$base" = "$merged" ]; then echo "the merge from an earlier land is still on master and the build is red: nothing taken back, the mark is kept"; exit 1; fi
        git reset -q --keep "$base" || { echo "local edits on files the merge changed: the merge is left on top"; exit 4; }
        rm -f "$mark"
        [ -z "$deps" ] || { npm install --no-audit --no-fund >/dev/null 2>&1 || echo "WARNING: npm install of master failed: node_modules is the branch's"; git checkout -q -- package-lock.json; }
        npm run build >/dev/null 2>&1 || echo "WARNING: the rebuild of master failed too: build/ is stale"
        echo "npm run build failed on master + $BRANCH: the merge is taken back"; exit 1
      fi
      rm -f "$log"
      sh "$main/scripts/sync-live-skills.sh" "$from" "$merged"
      rm -f "$mark"
      changed=$(git diff --name-only "$from" "$merged" -- src hooks templates .claude-plugin .mcp.json | head -5)
      if [ -n "$changed" ]; then
        echo "RESTART Claude: the server, hooks or bundled workflows changed ($(echo $changed))"
      else
        echo "no restart needed (server, hooks and bundled workflows unchanged)"
      fi
      echo "landed $BRANCH: $(git rev-parse --short HEAD)"
    env:
      TASK: "{{context.task}}"
      BRANCH: "{{context.branch}}"
    timeout: 600000
    resource: { locks: ["{{context.cwd}}-land"] }
    max_output: 16384
    context_set:
      land_out: "{{stdout}}"
    on_timeout: land_state_124
    cases:
      "0": mark_done
      "4": land_state_4
      "5": project_rebase
    default: land_failed

  # The driver has no shell: the main checkout's state after a timeout or a failed take-back is printed here,
  # and land_failed reads it from stdout; the exit code keeps the land's own.
  land_state_4:
    type: exec
    cwd: "{{context.cwd}}"
    command: &land_state |-
      echo "main checkout after the land:"
      git log --oneline -3
      echo "status (empty = clean):"
      git status --short | head -20
      exit "$CODE"
    env:
      CODE: "4"
    timeout: 20000
    on_success: land_failed
    on_error: land_failed

  land_state_124:
    type: exec
    cwd: "{{context.cwd}}"
    command: *land_state
    env:
      CODE: "124"
    timeout: 20000
    on_success: land_failed
    on_error: land_failed

  project_rebase:
    type: exec
    # No `cwd`: a wiped worktree must reach this script (a missing cwd fails the spawn), where it is told apart from a conflict.
    command: |-
      if [ ! -d "$WT" ]; then
        # Only a surviving branch is re-attached: a gone branch must never become a new empty one on the land route.
        git show-ref --verify --quiet "refs/heads/$BRANCH" || { echo "worktree $WT is missing AND branch $BRANCH is gone: nothing to re-attach"; exit 7; }
        echo "worktree $WT is missing (wiped, e.g. by a reboot): the branch $BRANCH survives, re-attach it"; exit 6
      fi
      cd "$WT" || exit 2
      git rebase master >&2 || { git rebase --abort; echo "rebase of $BRANCH onto master conflicts: aborted"; exit 1; }
      echo "rebased $BRANCH onto master $(git rev-parse --short master)"
    env:
      BRANCH: "{{context.branch}}"
      WT: "{{context.wt}}"
    timeout: 120000
    on_timeout: land_failed
    cases:
      "0": project_gate_rebased
      "1": rebase_conflict
      "6": rebase_reattach
    default: land_failed

  # The worktree directory is gone while its branch survives: project_prepare's own command re-attaches it (the shared anchor),
  # then the rebase runs again. Bounded: a worktree that stays missing leaves for land_failed, where the parent decides.
  rebase_reattach:
    station: false
    type: exec
    command: *prepare_cmd
    env:
      TASK: "{{context.task}}"
    max_visits: 2
    on_exhausted: land_failed
    timeout: 120000
    context_set:
      wt: "{{stdout}}"
    on_success: project_rebase
    on_error: land_failed

  # A conflicting rebase is the one land failure whose answer is always `rebase_fix`: this exec state routes it there
  # with no parent and no driver choice, twice per task. Its own max_visits is the bound: the third conflict follows
  # on_exhausted to land_failed (stdout and exit code stay those of project_rebase), where the parent decides.
  rebase_conflict:
    station: false
    type: exec
    command: |-
      echo "rebase of $BRANCH onto master conflicts: the worker resolves it (rebase_fix)"
    env:
      BRANCH: "{{context.branch}}"
    max_visits: 2
    on_exhausted: land_failed
    timeout: 20000
    on_success: rebase_fix
    on_error: land_failed

  land_failed:
    prompt: |-
      The land of {{context.task}} failed (exit {{exit_code}}):
      {{stdout}}
      {{stderr}}
      - The worktree is missing and could not be re-attached, never a `fix` round (a worker has no worktree to fix in): stdout
        says "worktree … is missing" (exit 6, after two re-attach rounds), or exit 1 / 2 with git's `worktree add` refusal in the
        stderr above and no "conflicts" or build text. Re-attach by hand (`git worktree add <wt> {{context.branch}}`) and `retry`,
        or `stop` and report it. Exit 7 ("branch … is gone"): the branch is lost; `close`, nothing to land.
      - 3 (the main checkout is not on master, or has uncommitted changes) → never stash or reset someone's
        work: tell the user and `retry` once it is clean, or `stop`.
      - 1 with "rebase of … onto master conflicts" (master moved under a reviewed branch): the workflow already sent
        the first two such conflicts of a task to `rebase_fix` by itself, so this is the third: the worker's resolutions
        did not hold against a master that kept moving. `fix` hands the conflict to the worker as a fix round, `close` when
        it cannot be resolved.
      - 1 (the build red on master + the branch — the merge is taken back) → `fix`: the cause goes to the worker
        as its fix round; `close` when it cannot be fixed in the branch.
      - 4 (the merge could not be taken back safely) → `stop` and report the main checkout's state printed above.
      - 124 (timeout) → read the main checkout's state printed above: master's head is not this task's merge and
        status is empty → `retry`; otherwise `stop` and report that state.
    transitions:
      retry: project_land
      fix: work
      close: blocked
      stop: stopped

  rebase_fix:
    max_visits: 2
    on_exhausted: blocked
    prompt: |-
      Master moved under the reviewed branch `{{context.branch}}` and the rebase conflicts. SendMessage
      `{{context.worker_agent}}` (gone → a fresh worker: Agent, model {{context.model}}, effort {{context.effort}},
      on the worktree {{context.wt}}) with exactly:

        Master moved under your reviewed branch {{context.branch}} and `git rebase master` conflicts. In
        {{context.wt}}: rebase onto master and resolve every conflict KEEPING BOTH SIDES (master's change and
        yours; never drop either to make it apply), keep ONE commit, `npm run check` green (run as
        `{{context.cwd}}/scripts/check-leased.sh` from the worktree, never bare), clean worktree.
        Report each conflicted file and how you resolved it.

      Then END your turn. On its notification verify ON-TREE: `git -C {{context.cwd}} log --oneline master..{{context.branch}}` shows one
      commit and `git -C {{context.wt}} status --porcelain` is empty → `gate` (the review that follows sees a
      changed tip and judges the resolution); stuck → `blocked`. Master having moved on AGAIN since is not a reason to
      ask the parent or to go back: the land rebases a lagging branch itself, and only a new conflict there returns here
      (the workflow counts it against the same two rounds). So whether master is an ancestor of the branch is not part of this verify.
    transitions:
      gate: project_gate
      blocked: blocked

  cleanup:
    station: false
    type: exec
    # Exact paths of this task only: the worktree <repo>/../.wt/<repo-name>/<ID> (or a legacy /tmp/wf-<ID> of a session started
    # before the move), its -browsers directory and its branch.
    command: |-
      case "$TASK" in ''|*[!A-Za-z0-9._-]*) echo "refused task id: '$TASK'"; exit 2;; esac
      main=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)") || exit 2
      case "$WT" in "$(dirname "$main")/.wt/$(basename "$main")/$TASK"|/tmp/wf-"$TASK"|/private/tmp/wf-"$TASK") ;; *) echo "refused worktree path: '$WT'"; exit 2;; esac
      if [ -d "$WT" ]; then
        dirty=$(git -C "$WT" status --porcelain)
        [ -z "$dirty" ] || { echo "kept $WT: not clean"; echo "$dirty" | head -5; exit 1; }
        [ ! -L "$WT/node_modules" ] || rm -f "$WT/node_modules" || exit 1
        git worktree remove --force "$WT" || exit 1
      fi
      # The per-worktree browsers directory the worker prompt prescribes: removed by this exact path only (the guard above already admits no other $WT).
      [ ! -d "$WT-browsers" ] || rm -rf "$WT-browsers" || exit 1
      # A wiped directory leaves a prunable entry that still holds the branch; prune drops only those.
      git worktree prune
      git branch -d "$BRANCH" || exit 1
      echo "removed $WT and $BRANCH"
    env:
      TASK: "{{context.task}}"
      WT: "{{context.wt}}"
      BRANCH: "{{context.branch}}"
    timeout: 120000
    on_success: done
    on_error: cleanup_failed

  blocked:
    prompt: |-
      {{context.task}} will not land as it stands. A driver hands back NEEDS-PARENT first and does the rest on the
      parent's answer. On `close` or `stop`: `queue_mark({file: "{{context.queue_file}}", id: "{{context.task}}", to:
      "failed", note: "<the reason, one line>"})`; keep the worktree {{context.wt}} and the branch for the
      user; then transition it (`stop` when the next lines depend on it).
      On the parent's message that the work is committed and green and it has amended the branch itself (the one
      missing edit, e.g. a CLAUDE.md row): no queue_mark, transition `parent_edited` (the gate runs, then the land).
      On the parent's message `regate` (the gate went red on a test OUTSIDE the task's diff, the parent names that test,
      and the branch is unchanged and committed): no queue_mark, transition `regate`. The gate runs again on the branch as
      it stands: green goes on as after any green gate (a review visit, then the land), red returns here with its output.
      `regate` is taken at most twice; a third only returns here, and then `parent_edited`, `close` or `stop` is the way on.
    transitions:
      close: closed
      stop: stopped
      parent_edited: project_gate_rebased
      regate: regate_gate

  done:
    terminal: true
    outcome: complete
    prompt: |-
      Engine slice {{context.task}} landed and cleaned:
      {{context.land_out}}
      Its lesson records are filed: the LANDED line's `lessons=` field is `{{context.lessons_out}}` verbatim (empty: `lessons=not run`).
      Tell the user its restart line as is. Its slot is free — in the dispatcher session
      {{parent_session_id}} transition `slot_free`.
