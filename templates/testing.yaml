name: testing
description: "Testing verification sub-workflow — unit tests first, then integration"
initial: assess
max_transitions: 30

states:
  assess:
    digest_on_repeat: true
    prompt: |
      Assess what verification is needed for the current change.

      **Decision matrix:**
      | Change type                        | Unit tests | Integration |
      |------------------------------------|-----------|-------------|
      | Pure logic (data, state, algorithms)| YES       | only if affects UI |
      | Logic + UI (commands, properties)   | YES       | YES |
      | Pure UI (layout, visual)            | no        | YES |

      **IMPORTANT**: Steps are strictly sequential. Never parallelize unit and integration —
      they often share the same output binary and will conflict.

      Choose transition:
      - `has_unit` → change touches logic with existing or meaningful tests
      - `skip_to_integration` → pure UI change, no unit-testable logic
      - `skip_all` → trivial wiring fix fully covered by existing tests
    transitions:
      has_unit: load_skills
      skip_to_integration: check_integration
      skip_all: project_gate

  load_skills:
    skills:
      - coding-skill-selector
      - ?project-skill-selector
    transitions:
      continue: unit_tests

  unit_tests:
    max_visits: 5
    prompt: |
      Write unit tests for the changed behavior. Running them is the next
      state, `project_test` (a project workflow may run its suite there itself).

      **If bug fix — Red-Green workflow (mandatory):**
      1. Write a test targeting the buggy behavior → run THAT test alone on
         the unfixed code → confirm it FAILS (red); skip the run when the
         red was already shown (bug-fix reproduction)
      2. Apply the fix; the green run is `project_test`

      **Otherwise:**
      1. Find existing test files for patterns
      2. Write tests covering new/changed behavior
      3. Register the new test file/suite if the runner requires it

      A run here (the red check) goes through a flat `general-purpose`
      subagent with `model: "haiku"`, `effort: "low"`, foreground,
      `run_in_background: false` — never inherit the session model.

      Budget: 5 visits to this state (engine-enforced); when nearly exhausted, choose `give_up` in fix_unit instead of retrying.

      Transition `run` → the tests run in `project_test`.
    transitions:
      run: project_test

  # Extension point (contract name): RUN the unit tests and decide. A project
  # heir (`extends: testing`) replaces it with an exec — on_success
  # check_integration, on_error fix_unit, on_timeout a state of its own.
  project_test:
    prompt: |
      Run the unit tests for the changed behavior (and the suite they belong to).

      Run via a flat `general-purpose` subagent (build/run/report — no
      workflow, no skills) to keep build output out of main context.
      Pass `model: "haiku"`, `effort: "low"` explicitly — a runner quotes results, it does
      not judge; never inherit the session model.
      A flat subagent inherits none of this project's skills or env
      rules — it only knows what YOU put in its spawn prompt. So include
      VERBATIM in that prompt: (a) any tooling/hook constraints that
      apply in this project (required CLIs, blocked commands), and
      (b) "Strip noise, but quote every error, failing assertion, and
      number VERBATIM — don't paraphrase the signal or replace it with
      a verdict; the parent judges.", and (c) "Bash: run commands
      FOREGROUND with an explicit timeout sized to the command;
      background ONLY for never-exiting processes (servers, watchers)
      or runs over the 10-min foreground ceiling."
      Spawn with `run_in_background: false` — you need the result before transitioning.

      Choose transition:
      - `pass` → all unit tests pass
      - `fail` → tests failing, need fixes
    transitions:
      pass: check_integration
      fail: fix_unit

  fix_unit:
    prompt: |
      Unit tests are failing. Analyze the failures and fix the code.

      Do NOT fix tests to match wrong behavior — fix the implementation.
      A small, already-diagnosed fix → edit inline YOURSELF; do NOT hand it to
      a background SendMessage-resume and idle-wait — that path is
      background-only and can't gate synchronously (see task-delegation
      Lifecycle). Delegate only a large/coupled fix.
      After fixing, transition back to re-run unit tests.

      Choose transition:
      - `retry` → fixed, re-run unit tests
      - `give_up` → unable to fix after multiple attempts
    transitions:
      retry: load_skills
      give_up: failed

  check_integration:
    prompt: |
      Does this change affect what the user sees or interacts with?

      - If yes AND the project has a debug bridge → `need_integration`
      - If yes but NO debug bridge / automated UI tooling exists → `manual_verify`
      - If no (pure backend/data change fully covered by unit tests) → `skip`

      Choose transition:
      - `need_integration` → must verify via integration test
      - `manual_verify` → UI-affecting change, no automated integration tooling
      - `skip` → unit tests are sufficient
    transitions:
      need_integration: project_build
      manual_verify: manual_verify
      skip: check_test_changes

  # Extension point (contract name): BUILD what integration launches. A
  # project heir replaces it with an exec — on_success integration, on_error
  # fix_integration.
  project_build:
    prompt: |
      Build the app for integration verification via a flat `general-purpose`
      subagent — it ONLY builds (integration launches); pass
      `model: "haiku"`, `effort: "low"` explicitly (runner, not judge).
      A flat subagent inherits none of this project's skills or env
      rules — it only knows what YOU put in its spawn prompt. So include
      VERBATIM in that prompt: (a) any tooling/hook constraints that
      apply in this project (required CLIs, blocked commands), and
      (b) "Strip noise, but quote every error, failing assertion, and
      number VERBATIM — don't paraphrase the signal or replace it with
      a verdict; the parent judges.", and (c) "Bash: run commands
      FOREGROUND with an explicit timeout sized to the command;
      background ONLY for never-exiting processes (servers, watchers)
      or runs over the 10-min foreground ceiling."
      Spawn with `run_in_background: false` — you need the result before transitioning.

      Choose transition:
      - `built` → build succeeded, verify it in integration
      - `failed` → build broken, fix it
    transitions:
      built: integration
      failed: fix_integration

  integration:
    max_visits: 5
    prompt: |
      Run integration verification on the build `project_build` produced.

      1. Launch via a flat `general-purpose` subagent — the subagent ONLY
         launches, nothing else; pass `model: "haiku"`, `effort: "low"`
         explicitly (runner, not judge); same spawn-prompt rules as the
         build runner (project constraints, verbatim quoting, foreground
         with a timeout — a never-exiting app runs in background)
      2. Drive the debug bridge YOURSELF (the parent): simulate the
         actual user workflow end-to-end
      3. Verify state changes propagated correctly YOURSELF via the
         bridge (screenshots, state inspection)

      **Bug fixes**: reproduce the EXACT user scenario that triggered the bug.
      Check for regressions in related workflows.

      Budget: 5 visits to this state (engine-enforced); when nearly exhausted, choose `give_up` in fix_integration instead of retrying.

      Choose transition:
      - `pass` → integration verified, behavior correct
      - `fail` → integration broken, need fixes
    transitions:
      pass: user_testing
      fail: fix_integration

  fix_integration:
    # build failures loop here without passing integration's budget
    max_visits: 5
    on_exhausted: failed
    prompt: |
      Integration test failed. Analyze what broke and fix it.

      A small, already-diagnosed fix → edit inline YOURSELF; do NOT hand it to
      a background SendMessage-resume and idle-wait — that path is
      background-only and can't gate synchronously (see task-delegation
      Lifecycle). Delegate only a large/coupled fix.
      After fixing, transition back to rebuild and re-run integration.

      Choose transition:
      - `retry` → fixed, rebuild and re-run integration tests
      - `give_up` → unable to fix after multiple attempts
    transitions:
      retry: project_build
      give_up: failed

  manual_verify:
    prompt: |
      The change affects what the user sees, but no debug bridge or automated
      UI tooling is available. Do NOT silently skip verification:

      1. Verify everything you can without UI tooling: build succeeds, unit-level
         checks, code-level trace of the affected path
      2. Write concrete manual verification steps: exact user actions and the
         expected result of each
      3. Include those steps in your final report so the user (or the parent
         workflow) can run them

      Choose transition:
      - `done` → checks done, manual steps written — hand them to the user
      - `give_up` → cannot verify anything (e.g. build is irrecoverably broken)
    transitions:
      done: user_testing
      give_up: failed

  user_testing:
    prompt: |
      Hand verification to the user. Give them everything needed to start
      IMMEDIATELY — no digging on their side:

      - **Web**: the exact URL(s) — host, port, and the deep path to the
        affected screen (e.g. http://localhost:5173/settings/profile).
        If the dev server is not running, start it first (background) and
        confirm it responds BEFORE handing over the link.
      - **Desktop / mobile**: how the app was launched and where it runs
        (window, simulator, device) + how to reach the affected screen.
      - Test credentials / fixture data if the flow needs them.
      - The concrete check steps: each user action and its expected result
        (reuse the manual_verify steps if that state ran).

      Then WAIT for the user's verdict. If there is no interactive user
      (headless / subagent run) → do NOT wait, transition `skip`.

      - `ok` → user confirms the changes work
      - `fix` → user found an issue
      - `skip` → user unavailable; the steps stay in the final report
    transitions:
      ok: check_test_changes
      fix: fix_user_issue
      skip: check_test_changes

  fix_user_issue:
    prompt: |
      The user found an issue during manual testing. Ask what exactly is
      wrong if unclear. Fix the code — a small, already-diagnosed fix → edit
      inline YOURSELF; do NOT hand it to a background SendMessage-resume and
      idle-wait, that path is background-only and can't gate synchronously
      (see task-delegation Lifecycle). Delegate only a large/coupled fix. Then:

      - `retry` → re-assess verification (unit tests if the fix touched
        logic, then integration/manual verify → user testing again)
      - `give_up` → unable to fix
    transitions:
      retry: reassess
      give_up: failed

  reassess:
    prompt: |
      Re-verify after fixing a user-reported issue. The bug slipped past the
      earlier checks, so no level may be skipped outright — and the loop MUST
      end with the user confirming the fix.

      - `unit` → fix touched logic: cover the user's exact scenario Red-Green
        (write a unit test that fails on the old behavior first), then the
        chain re-runs through integration → user testing
      - `no_unit` → pure UI fix, nothing unit-testable: go straight to
        integration/manual verify → user testing
    transitions:
      unit: load_skills
      no_unit: check_integration

  # Fixes made during testing (any fix_* visit) bypassed the normal review —
  # review them now; a clean pass goes straight to done.
  check_test_changes:
    type: exec
    command: '[ -z "$FIX_VISITS" ] && exit 0; exit 10'
    env:
      FIX_VISITS: "{{visits.fix_unit}}{{visits.fix_integration}}{{visits.fix_user_issue}}"
    cases:
      "0": project_gate
      "10": review_test_changes
    default: review_test_changes

  review_test_changes:
    sub_workflow: code-review
    on_complete: project_gate
    on_fail: project_gate

  # Extension point (contract name): the project's end-of-change gate, after
  # every edit of this run. Bundled: none — passes straight to done. A project
  # heir replaces it with an exec — on_success done, on_error failed (the
  # caller's fix round), on_timeout a state of its own (a slow machine is not
  # a code defect).
  project_gate:
    type: exec
    command: "true"
    on_success: done
    on_error: done

  done:
    prompt: "Verification complete: required tests pass (manual steps, if any, reported)."
    terminal: true

  failed:
    prompt: "Testing failed after maximum attempts. Report failures to the user."
    terminal: true
    outcome: fail
