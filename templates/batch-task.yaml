name: batch-task
description: "One task of a `batch` queue — a child session a cheap DRIVER agent runs for the batch dispatcher (`driver:`): claim (the line's difficulty → model/effort by model_table) → project_prepare [exec: a worktree beside the repo] → work (one worker agent) → review_scope [exec: the diff's class → the reviewer's model] → review (one reviewer agent; FIXES → work) → project_land [exec: merge --no-ff + the queue's land_test under the repo's land lock] → mark_done [exec: `[x]` + the record_file line] → cleanup [exec] → done. A project overrides project_prepare / project_land through `extends: batch-task`."
initial: claim
max_transitions: 60

# The line's `difficulty:` (1..10) → the model and effort of EVERY stage: context_set `difficulty` and
# the engine writes `model_<stage>` / `effort_<stage>` for each stage below, and `model` / `effort`
# (and `model_step`, `escalations`) = the execute row. Each `escalate` entry moves the execute and fix
# stages one row up once its state's visits reach the number: `work: 3` = the second fix round; plan,
# review and review_verify keep the difficulty's own row. `review_class` (the review_scope exec: `light`
# = tests/docs only, else `code`) → `review_model` / `review_effort` (= `model_review` /
# `effort_review`): the class's `review` entry overrides the review stage, a class without one keeps it.
# Stage use here: execute = the first worker, fix = a fix round's worker, review = round 1, review_verify
# = round 2 and later; plan is written for a plan step a heir adds.
# The starting values are calibrated on ONE project (154 round-1 review findings over 39 tasks): the
# findings per band decided where a stronger plan, review or worker pays — measure your own with the
# ledger and replace the table whole in an heir (`model_table:` in the heir replaces this one).
model_table:
  stages:
    plan:
      - { upto: 3, model: sonnet, effort: high }
      - { upto: 6, model: opus, effort: high }
      - { upto: 8, model: opus, effort: high }
      - { upto: 10, model: opus, effort: xhigh }
    execute:
      - { upto: 3, model: sonnet, effort: high }
      - { upto: 6, model: sonnet, effort: high }
      - { upto: 8, model: opus, effort: high }
      - { upto: 10, model: opus, effort: xhigh }
    review:
      - { upto: 8, model: opus, effort: high }
      - { upto: 10, model: opus, effort: xhigh }
    review_verify:
      - { upto: 10, model: sonnet, effort: high }
    fix:
      - { upto: 6, model: sonnet, effort: high }
      - { upto: 10, model: opus, effort: high }
  escalate:
    work: 3
  review:
    light: { model: sonnet, effort: medium }

# The task's DRIVER: a cheap agent that runs this session's prompts for the dispatcher (`start` answers
# with its exact Agent call). Its instructions are the shipped `templates/drivers/task-driver.md`; a heir
# points `prompt_ref` at its own (a path) or replaces `driver:` whole.
driver:
  model: haiku
  effort: low
  prompt_ref: task-driver

# Agents' outputs are FILES in the task's log dir ({{context.wt}}.log, beside the worktree, kept after
# cleanup): the worker writes report.md (handoff.md when it stops unfinished), the reviewer review.md;
# each answers with ONE line naming its file, so the driver and the dispatcher stay small.

# Extension points (a heir replaces a state whole and keeps its routes):
#   project_prepare — stdout = the worktree path alone (→ context.wt); on_success: work, on_error: prepare_failed
#   project_land    — merge the task's branch and verify; "0" → mark_done, else land_failed, on_timeout: land_failed
# The session's cwd is the task's repo (the dispatcher starts it there).
states:
  claim:
    prompt: |-
      Task session {{session_id}} (dispatcher {{parent_session_id}}), repo {{context.cwd}}. The pick already
      marked the line `[>]`. Every `transition` reply IS the next prompt — never call `status` after it.
      context_set on THIS session (session_id {{session_id}}), each its own call — skip a key the dispatcher
      already passed to `start` (task {{context.task}}, queue_file {{context.queue_file}}, difficulty
      {{context.difficulty}}, model {{context.model}}, effort {{context.effort}}; empty = not passed — a
      driven task needs none of the queue line):
        task       — the line's ID
        queue_file — the queue's absolute path (the dispatcher's `queue_file`)
        memory_index — the project's memory index path, when the dispatcher has one ({{context.memory_index}}; optional)
        difficulty — the line's difficulty column, when it is not `-`: the engine then sets `model` and
                     `effort` from this workflow's model_table (its reply names them) — do not set them yourself
        model, effort — ONLY when the line has no difficulty: its columns (effort `-` → task-delegation's table)
      Then transition `prepare` (an exec: the worktree is made before any agent starts).
    transitions:
      prepare: project_prepare

  project_prepare:
    type: exec
    # stdout is the worktree path alone (no newline) — it becomes context.wt; messages go to stderr.
    # Worktrees live beside the repo (`<repo>/../.wt/<repo-name>/<ID>`), never under /tmp.
    command: |-
      case "$TASK" in ''|*[!A-Za-z0-9._-]*) echo "refused task id: '$TASK'" >&2; exit 2;; esac
      repo=$(git rev-parse --show-toplevel) || exit 2
      root=$(dirname "$repo")/.wt/$(basename "$repo")
      wt=$root/$TASK
      if [ -d "$wt" ]; then
        echo "kept $wt ($(git -C "$wt" symbolic-ref --short HEAD) @ $(git -C "$wt" rev-parse --short HEAD))" >&2
      else
        mkdir -p "$root" || exit 1
        git worktree add "$wt" -b "batch/$TASK" HEAD >&2 || exit 1
        echo "made $wt on batch/$TASK @ $(git rev-parse --short HEAD)" >&2
      fi
      printf %s "$wt"
    env:
      TASK: "{{context.task}}"
    timeout: 60000
    context_set:
      wt: "{{stdout}}"
    on_success: work
    on_error: prepare_failed

  prepare_failed:
    prompt: |-
      The worktree for {{context.task}} was not made (exit {{exit_code}}):
      {{stderr}}
      A stale branch `batch/{{context.task}}` without its directory: decide (delete it only if it holds nothing
      unmerged) and `retry`. Otherwise `queue_mark({file: "{{context.queue_file}}", id: "{{context.task}}", to:
      "released"})` (back to `[ ]`, nothing was made) → `release`, or `to: "failed"` with the reason as `note`
      → `close`.
    transitions:
      retry: project_prepare
      release: released
      close: closed

  work:
    max_visits: 3
    on_exhausted: blocked
    prompt: |-
      {{stderr}}
      Worktree {{context.wt}} (branch `batch/{{context.task}}`). Visit {{visits.work}} of 3.
      First visit — start the worker's session yourself, then hand it to the agent:
      1. `start({workflow: "subagent", parent_session_id: "{{session_id}}", cwd: "{{context.wt}}"})` → W;
         context_set `worker_session` = W.
      2. Spawn ONE worker: Agent, model {{context.model}}, effort {{context.effort}}, `run_in_background: true`;
         context_set `worker_model` = "{{context.model}}/{{context.effort}}". Prompt:

           You are the worker of task {{context.task}}. Your brief is its line in {{context.queue_file}}
           (read it there; it is self-contained). Your workflow session is W, already started — do NOT call
           start(): first `status({session_id: "W"})`, then follow it to its terminal, passing session_id W
           in every call; every `transition` reply IS the next prompt — never call `status` after it. Work
           ONLY inside {{context.wt}} (branch `batch/{{context.task}}`): ONE commit on that branch, a clean
           worktree at the end; never touch {{context.cwd}} itself; never push. Check the on-disk state
           first — work already applied is reconciled, not done twice. Your report is a FILE: write
           {{context.wt}}.log/report.md (what changed and why, the checks run; then the sections
           `## Follow-up not done`, `## Tool defect found`, `## Open` — each a short list, `none` when empty;
           mkdir -p the dir), and {{context.wt}}.log/handoff.md when you stop unfinished (the same three sections). On a fix
           round, carry the previous report.md's three sections' items into the new file. Answer with ONE line:
           `DONE <sha> report={{context.wt}}.log/report.md` or `BLOCKED <reason> report=<the file>`.

      3. `link_agent({session_id: W, agent_id: <its id>})` (the engine records it as this visit's agent);
         context_set `worker_agent` = its id.
      A later visit (a fix round, the cause from the review or the land) arrives as "Revisit #N", and the
      values this prompt rendered are the first visit's: read each one it uses from P's context now
      (`status` with `key`) — `model_fix` / `effort_fix` (a fix round's worker; empty — no difficulty, or a
      table without a `fix` stage — = `model` / `effort`) against `worker_model` (stored as `model/effort`), and `worker_agent`, `worker_session`:
      - the same `model/effort` → SendMessage `worker_agent` with the cause: its one line plus "read <its file>
        whole" (never the file's text pasted); then `link_agent({session_id: <worker_session>, agent_id:
        <worker_agent>})` again — it marks the worker as this visit's;
      - different model or effort (the fix stage's row, or an escalation, names another) → steps 1–3 again with `model_fix` /
        `effort_fix` (empty = `model` / `effort`) in place of `model` / `effort`: a fresh worker on the new model, its
        prompt above plus "a fix round of a previous worker's branch: <the cause's line> — read <its file> whole".
      Then END your turn on this task. On the worker's notification: context_set `tokens_worker` = the
      value already set ({{context.tokens_worker}}, empty = 0) PLUS this agent's tokens from its notification's
      usage line. Verify ON-TREE (artifacts outrank the report): `git -C {{context.cwd}} log --oneline
      HEAD..batch/{{context.task}}` shows its commit and `git -C {{context.wt}} status --porcelain` is empty
      → `review`; the worker is stuck, or the work is wrong and another round would not help → `blocked`.
    transitions:
      review: review_scope
      blocked: blocked

  review_scope:
    type: exec
    # The reviewer by the actual diff: stdout `light` (tests/docs only) or `code` → context.review_class,
    # which the model_table maps to review_model / review_effort. Never fails a task: doubt is `code`.
    command: 'sh "$WF_PLUGIN_ROOT/scripts/review-class.sh" HEAD "batch/$TASK"'
    env:
      TASK: "{{context.task}}"
    timeout: 60000
    context_set:
      review_class: "{{stdout}}"
    on_success: review
    on_error: review

  review:
    max_visits: 3
    on_exhausted: blocked
    prompt: |-
      {{stderr}}
      Review {{visits.review}} of 3 of {{context.task}} (branch `batch/{{context.task}}`, worktree {{context.wt}}).
      1. `start({workflow: "file-review", parent_session_id: "{{session_id}}", cwd: "{{context.wt}}"})` → R;
         context_set `review_session` = R.
      2. Spawn ONE reviewer: Agent, model {{context.review_model}}, effort {{context.review_effort}} (both
         empty → {{context.model}}, {{context.effort}}); from review 2 on (a verification of the fixes)
         model {{context.model_review_verify}}, effort {{context.effort_review_verify}} instead (empty =
         keep the above); `run_in_background: true`, prompt:

           You review task {{context.task}} of {{context.queue_file}}, read-only: its line is the brief, the
           change is `git -C {{context.cwd}} diff HEAD...batch/{{context.task}}` (scope `diff`, your batch =
           every file it touches). Your workflow session is R, already started — do NOT call start(): first
           `status({session_id: "R"})`, then follow it to its terminal, passing session_id R in every call;
           every `transition` reply IS the next prompt — never call `status` after it. Your review is a
           FILE: write {{context.wt}}.log/review.md (the verdict, the reasons; for FIXES the full fix list;
           a section `## Notes (non-blocking)` with the follow-ups you saw, `none` when empty; when review.md already exists (an earlier round), carry its `## Notes (non-blocking)` items into the new file; mkdir -p the dir). Answer with ONE line: `VERDICT MERGE|FIXES|REJECT <one-line summary>
           review={{context.wt}}.log/review.md design=yes|no` (design=yes: a fix needs a design choice).

      3. `link_agent({session_id: R, agent_id: <its id>})` (the engine records it as this visit's agent).
         END your turn on this task.
      On its notification: context_set `tokens_review` = the value already set ({{context.tokens_review}},
      empty = 0) PLUS this agent's tokens, then route by the verdict: MERGE → `land`; FIXES → `fix` (the
      worker's cause = the verdict line + "read {{context.wt}}.log/review.md whole"; with design=yes the driver first asks its decider, see its instructions, and adds "read {{context.wt}}.log/decisions.md whole"); REJECT → `reject`. The context_set first, the transition after
      it returned.
    transitions:
      land: project_land
      fix: work
      reject: blocked

  project_land:
    type: exec
    # One land per repo at a time machine-wide: the merge and its tests never interleave with another
    # task's. The test command is the queue header's `land_test:` (none → merge only); a failed test
    # takes the merge back (`reset --keep`, never `--hard`: edits made meanwhile survive), so the repo is
    # not left red; when that is unsafe it exits 4 and touches nothing.
    command: |-
      case "$TASK" in ''|*[!A-Za-z0-9._-]*) echo "refused task id: '$TASK'"; exit 2;; esac
      branch=batch/$TASK
      if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
        echo "refused: $(pwd) has uncommitted changes"; git status --short --untracked-files=no | head -5; exit 3
      fi
      test_cmd=$("$WF_PLUGIN_ROOT/scripts/wf-queue" "$QUEUE" --header land_test) || exit 2
      before=$(git rev-parse HEAD)
      if ! out=$(git merge --no-ff --no-edit "$branch" 2>&1); then
        echo "$out" | tail -20; git diff --name-only --diff-filter=U | head -20
        git merge --abort 2>/dev/null || git reset -q --keep "$before" ||
          { echo "merge of $branch failed and could not be taken back: see git status"; exit 4; }
        echo "merge of $branch onto $(git rev-parse --short HEAD) failed: taken back"; exit 1
      fi
      merged=$(git rev-parse HEAD)
      if [ -n "$test_cmd" ]; then
        log=$(mktemp); sh -c "$test_cmd" >"$log" 2>&1; rc=$?
        if [ "$rc" -ne 0 ]; then
          tail -40 "$log"; rm -f "$log"
          # Only the merge is taken back: --keep refuses to touch a file edited meanwhile, and a HEAD that
          # moved during the test (a commit, another branch) is never reset.
          [ "$(git rev-parse HEAD)" = "$merged" ] || { echo "HEAD moved during land_test: nothing taken back"; exit 4; }
          git reset -q --keep "$before" ||
            { echo "local edits on files the merge changed: the merge is left on top"; exit 4; }
          echo "land_test failed (exit $rc): the merge of $branch is taken back"; exit 1
        fi
        tail -5 "$log"; rm -f "$log"
      fi
      echo "landed $branch: $(git rev-parse --short HEAD)"
    env:
      TASK: "{{context.task}}"
      QUEUE: "{{context.queue_file}}"
    timeout: 3600000
    resource: { locks: ["{{context.cwd}}-land"] }
    max_output: 16384
    context_set:
      land_out: "{{stdout}}"
    on_timeout: land_failed
    cases:
      "0": mark_done
    default: land_failed

  land_failed:
    prompt: |-
      The land of {{context.task}} failed (exit {{exit_code}}):
      {{stdout}}
      {{stderr}}
      - 3 (the repo's own tree has uncommitted changes) → never stash or reset someone's work: tell the
        user and `retry` once it is clean, or `stop`.
      - 1 (merge conflict, or land_test failed — the merge is taken back) → `fix`: the cause goes to the
        worker as its fix round; `close` when it cannot be fixed in the branch.
      - 4 (the merge could not be taken back safely: HEAD moved during land_test, or local edits on the
        merged files) → `stop` and report the repo's exact state (`git log --oneline -3`, `git status`).
      - 124 (timeout) → read `git -C {{context.cwd}} log --oneline -3` and `status`: no merge on top and
        clean → `retry`; otherwise `stop` and report the repo's exact state.
    transitions:
      retry: project_land
      fix: work
      close: blocked
      stop: stopped

  mark_done:
    type: exec
    # Bookkeeping without a model turn: `[x]` with the landed sha, then — when the queue header names a
    # `record_file:` (relative = beside the queue) — one record line from the task's context. A failed
    # append only warns: the task landed and `[x]` is set, so cleanup must still run.
    command: |-
      sha=$(git rev-parse --short HEAD) || exit 1
      "$WF_PLUGIN_ROOT/scripts/wf-queue" "$QUEUE" --done "$TASK" --note "landed $sha" || exit 1
      rec=$("$WF_PLUGIN_ROOT/scripts/wf-queue" "$QUEUE" --header record_file) || exit 1
      [ -n "$rec" ] || exit 0
      case "$rec" in /*) ;; *) rec=$(dirname "$QUEUE")/$rec;; esac
      printf '%s\n' "- $(date +%Y-%m-%d) $TASK landed $sha | difficulty: ${DIFFICULTY:--} | model: $MODEL/$EFFORT | review: ${REVIEW_MODEL:-$MODEL}/${REVIEW_EFFORT:-$EFFORT} | rounds: $ROUNDS | tokens: worker=${TOKENS_WORKER:-0} review=${TOKENS_REVIEW:-0} | report: $WT.log/report.md" >>"$rec" ||
        { echo "warning: the record line for $TASK was not appended to $rec" >&2; exit 0; }
      echo "recorded $TASK in $rec"
    env:
      TASK: "{{context.task}}"
      QUEUE: "{{context.queue_file}}"
      WT: "{{context.wt}}"
      DIFFICULTY: "{{context.difficulty}}"
      MODEL: "{{context.model}}"
      EFFORT: "{{context.effort}}"
      REVIEW_MODEL: "{{context.review_model}}"
      REVIEW_EFFORT: "{{context.review_effort}}"
      ROUNDS: "{{visits.work}}"
      TOKENS_WORKER: "{{context.tokens_worker}}"
      TOKENS_REVIEW: "{{context.tokens_review}}"
    timeout: 60000
    on_success: cleanup
    on_error: cleanup_failed

  cleanup:
    type: exec
    # Exact paths of this task only; the worktree path must end in the task id.
    command: |-
      case "$TASK" in ''|*[!A-Za-z0-9._-]*) echo "refused task id: '$TASK'"; exit 2;; esac
      case "$WT" in /*/"$TASK") ;; *) echo "refused worktree path: '$WT'"; exit 2;; esac
      if [ -d "$WT" ]; then
        dirty=$(git -C "$WT" status --porcelain)
        [ -z "$dirty" ] || { echo "kept $WT: not clean"; echo "$dirty" | head -5; exit 1; }
        git worktree remove --force "$WT" || exit 1
      fi
      git branch -d "batch/$TASK" || exit 1
      echo "removed $WT and batch/$TASK"
    env:
      TASK: "{{context.task}}"
      WT: "{{context.wt}}"
    timeout: 120000
    on_success: done
    on_error: cleanup_failed

  cleanup_failed:
    prompt: |-
      Bookkeeping or cleanup of the landed {{context.task}} refused (exit {{exit_code}}):
      {{stdout}}
      {{stderr}}
      Leave what it kept; make sure the line is `[x]` (`queue_mark` to `done` if the mark step failed) and
      note what was kept on it. Transition `done`.
    transitions:
      done: done

  blocked:
    prompt: |-
      {{context.task}} will not land. `queue_mark({file: "{{context.queue_file}}", id: "{{context.task}}", to:
      "failed", note: "<the reason, one line>"})`; keep the worktree {{context.wt}} and the branch for the
      user. Transition `close`, or `stop` when the next lines depend on it.
    transitions:
      close: closed
      stop: stopped

  done:
    terminal: true
    outcome: complete
    prompt: "Task {{context.task}} landed and cleaned. A driver: reply with your last line (LANDED …) and stop — the dispatcher's session is not yours. The dispatcher itself (no driver): its slot is free — in {{parent_session_id}} transition `slot_free`."

  closed:
    terminal: true
    outcome: complete
    prompt: "Task {{context.task}} closed without landing (`[!]`). A driver: reply with your last line (CLOSED …) and stop — the dispatcher's session is not yours. The dispatcher itself (no driver): its slot is free — in {{parent_session_id}} transition `slot_free`."

  released:
    terminal: true
    outcome: complete
    prompt: "Task {{context.task}} released before any work (`[ ]` again). A driver: reply with your last line (CLOSED …) and stop — the dispatcher's session is not yours. The dispatcher itself (no driver): in {{parent_session_id}} transition `slot_free`."

  stopped:
    terminal: true
    outcome: fail
    prompt: |-
      Task {{context.task}} STOPPED: report to the user the task, the reason, and the exact state of
      {{context.cwd}} (`git log --oneline -3`, `git status`). A driver: put that in a NEEDS-PARENT line and
      stop — the dispatcher's session is not yours. The dispatcher itself (no driver): in {{parent_session_id}}
      transition `stop`.
