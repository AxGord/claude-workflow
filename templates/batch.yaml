name: batch
description: "Long-running batch orchestration — a queue file of tasks; the engine admits the next lines into the window (wf-queue / queue_next: batch_size, after:, touches:, owner:, ⏸), each admitted task runs as a child session (`batch-task`: worktree → worker → merge + tests under the repo's land lock) driven by this agent, and every freed slot re-runs the pick; one fresh-eyes review of the combined diff."
initial: load_skills
max_transitions: 1000

# A project's heir (`extends: batch`) usually overrides `plan_queue` with an exec that names its fixed
# queue and its own task workflow (context_set `queue_file`, `task_workflow`); the per-task steps a
# project owns (`project_prepare`, `project_land`) live in `batch-task`.
states:
  load_skills:
    skills:
      - task-delegation
    transitions:
      continue: plan_queue

  plan_queue:
    task: "Build or resume the batch queue"
    prompt: |
      Build the task queue for this batch run.

      1. **Resume check** — list `{{context.cwd}}/.claude/batch/*.md`. If a
         queue file has pending `[ ]` or running `[>]` lines and matches the
         user's ask, RESUME it: `suspended` → `resume` the task sessions of
         the previous run (they keep their worktrees); a `[>]` line whose
         session is gone → `queue_mark({file, id, to: "released"})` (nothing
         of it landed) and its worktree is reused by the next pick. No
         `base:` line → reconstruct it per repo (the last commit before the
         queue's first task landed: `git log --before=<queue file ctime>`).
         Then go to step 3.
      2. **New queue** — write `{{context.cwd}}/.claude/batch/<short-name>.md`:
         ```
         # Batch: <short-name>
         batch_size: 3
         base: <repo-abs-path>=<sha>
         land_test: <the project's test command, run after each merge; omit for none>
         ## Tasks
         - [ ] T1 | model: opus | effort: high | touches: src/a, docs | <self-contained task prompt> |
         - [ ] T2 | model: sonnet | effort: high | after: T1 | touches: src/b | repo: other-repo | <prompt> |
         ```
         Keep the queue file out of git (untracked + ignored, e.g. `.claude/batch/`
         in `.gitignore`): a tracked queue dirties the tree on the first pick and
         every land refuses (exit 3).
         One `base:` line per repo the tasks touch; <sha> = `git -C <repo>
         stash create` (snapshots a dirty tree without touching it) or `git -C
         <repo> rev-parse HEAD` when that prints nothing (clean tree).
         Line fields (`key: value`, any order; the rest is the task's text):
         - `model` / `effort` — per task-delegation's table: opus/high for
           non-trivial code/judgement, sonnet/high for code from a detailed
           plan, sonnet/medium for routine review, haiku/low for runners.
           `model: —` = a line the parent does itself (never admitted).
         - `touches:` — the paths (prefixes) the task edits. Two lines of one
           repo whose paths overlap never run together; a line WITHOUT
           `touches:` runs alone in its repo. With `overlap: files` in the
           header only FILE entries (an existing file, or a new path like
           `src/x/Foo.hx`) conflict, on the same file; a directory or glob
           entry is a hint. `owner:` — one
           name (`typer`, `typer.flow`): lines of one owner run one at a
           time. `exclusive: yes` — the line runs alone (mass moves, renames,
           reformats).
         - `after:` — ids that must be `[x]` first.
         - `repo:` — another repo (absolute path, or a name: the `base:` repo
           of that name, else the directory beside this project); default
           this project.
         - `workflow:` — the line's own task workflow (e.g. the heir of
           `batch-task` its repo defines); default this run's `task_workflow`.
         - `⏸` in a field — the line is skipped until the mark is removed.
         Each task runs in its OWN worktree (`<repo>/../.wt/<repo-name>/<ID>`,
         branch `batch/<ID>`) and lands by `git merge --no-ff` + `land_test`,
         one land per repo at a time — so tasks need not avoid sharing
         infrastructure files; `touches:` is about logic that must not be
         edited twice at once. Each line is self-contained: a worker sees ONLY
         its line. `batch_size` = max parallel tasks; `batch_size: 0  # why,
         was N` pauses: running tasks finish, nothing new starts. The user may
         edit the file mid-run — every pick re-reads it.
      3. `context_set(key: "queue_file", value: "<absolute path>")` and
         `context_set(key: "task_workflow", value: "batch-task")` (a project
         with its own heir of `batch-task` names it here).
      4. → transition `ready`.

      Marks: `[ ]` pending, `[>]` running, `[x]` done, `[!]` failed. Only the
      engine changes marks: `queue_next` / `queue_mark` (exec: `wf-queue`),
      under the queue's lock. Once the run is live, change the queue through
      the same lock: `queue_add` (new line, checked as a pick reads it),
      `queue_edit` (a line's fields, a note), `queue_header` (window / pause
      with its reason), `queue_mark` with `retry: true` (a `[!]` line again)
      — a script or sed edit can drop a mark an exec writes at that moment. The queue FILE is the source of truth — it
      survives context compression and session restarts.
    transitions:
      ready: pick

  pick:
    type: exec
    # Deterministic admission + `[>]` marks under the queue's lock (the exec form of queue_next).
    command: '"$WF_PLUGIN_ROOT/scripts/wf-queue" "$QUEUE" --explain'
    env:
      QUEUE: "{{context.queue_file}}"
    timeout: 60000
    max_output: 16384
    cases:
      "0": dispatch
      "10": collect
      "11": cross_check
      "12": paused
    default: pick_failed

  pick_failed:
    prompt: |-
      The pick failed (exit {{exit_code}}):
      {{stdout}}
      {{stderr}}
      A held lock (`<queue>.lock`: another pick is writing) → `retry`. A malformed queue (no `## Tasks`,
      no `batch_size:`) → fix the header and `retry`, or `stop`.
    transitions:
      retry: pick
      stop: report

  paused:
    prompt: |-
      The queue is paused (`batch_size: 0`) and none of its tasks runs:
      {{stderr}}
      Tell the user the pause and its reason (the comment above). When they lift it (`queue_header({file:
      "{{context.queue_file}}", batch_size: N, reason})`, or their own edit) → `retry`; to end the run now → `report`.
    transitions:
      retry: pick
      report: report

  dispatch:
    prompt: |-
      The pick admitted (and marked `[>]` in {{context.queue_file}}) one line per free slot, `ID model effort repo workflow`:
      {{stdout}}
      {{stderr}}

      For EACH admitted line, one task session:
      1. `start({workflow: <its workflow column; `-` → "{{context.task_workflow}}">, parent_session_id:
         "{{session_id}}", cwd: "<its repo>"})` → session P (the repo's own workflows are found from that cwd). Drive P by its prompts, passing session_id P in every call (its `claim` names what to
         record, its exec steps make the worktree before any agent starts).
      2. context_set `tasks` on THIS session ({{session_id}}): one `ID=P` per running task session (all of
         them, not only the new ones) — after a context compression `status({session_id: "{{session_id}}",
         key: "tasks"})` and `sessions` are the truth, not your memory.
      Then transition `dispatched` and END your turn: agent notifications wake you in `collect`.
    transitions:
      dispatched: collect

  collect:
    prompt: |-
      Task sessions: `status({session_id: "{{session_id}}", key: "tasks"})` (ID=P). Last pick:
      {{stderr}}

      Woken by an agent notification: find its task session (the agent is linked to a session whose
      parent is P; `sessions` shows `[agent …]`), read `status(P)` and advance P by its prompt (session_id
      P). A transition into P's exec steps (the land waits for the repo's land lock) may outlive the call
      and finish in the background — move other tasks meanwhile.
      Resumed after a restart: every task session P is YOURS — `resume` each; the sessions the resume
      lists are their agents' (SendMessage exactly as it prints).

      Route this session:
      - a task session reached its terminal (`done` / `closed` / `released`) → update `tasks`, then
        `slot_free` (the pick runs again and refills the freed slot).
      - a task session ended `stopped` → `stop`.
      - task sessions still running, none ended → END your turn here, no transition.
      - none of YOURS runs and the last pick admitted nothing (exit 10: the `[>]` lines left belong to
        other sessions, or block by overlap) → `stalled`.
    transitions:
      slot_free: pick
      stalled: cross_check
      stop: report

  cross_check:
    max_visits: 3
    prompt: |
      All workers finished. This is the run's ONE fresh-eyes review.
      Workers do NOT review themselves (a sub-agent's coding/bug-fix
      review stops at lint + its own intent re-read — the spawner owns
      the independent review), so nothing below is a re-review.

      1. The run's diff, per `base:` repo: `git -C <repo> diff <sha> --stat`
         (a `review_base:` line from a previous visit → diff from it
         instead: this visit reviews only the refill's delta) — it covers
         merged worktree branches and uncommitted shared-tree edits alike;
         plus `git -C <repo> ls-files --others --exclude-standard` — new
         files a shared-tree worker never committed are NOT in the diff.
         Compare both against the task lines in {{context.queue_file}}.
      2. Batch the changed files for review like code-review does:
         source+test together, change-coupled files together, then by
         directory; at most 5 files AND ~500 changed lines per batch;
         under ~40 changed lines of purely mechanical/wiring diffs → no
         agent, review those lines yourself in step 3. Each batch agent
         gets its file list, `git -C <repo> diff <sha> -- <file>` per file
         (a new file: read it whole), scope `diff`, "report one section per
         file + a batch-level cross-file section", explicit `model` and `effort`
         (sonnet/medium for linter-covered/routine code, opus/high for
         engine-critical / concurrency / no-linter), and this preamble
         VERBATIM:
      ---
      IMPORTANT: Override the default CLAUDE.md rule about start().
      Do NOT call start() without arguments.
      Instead, your FIRST action must be:
        mcp__plugin_workflow_wf__start({ workflow: "file-review", parent_session_id: "<SESSION_ID>" })
      where <SESSION_ID> is the current session ID (substitute it before sending).
      Then follow the file-review workflow states until completion.
      start() returns `SESSION: <id>` — pass that session_id explicitly in every
      subsequent workflow tool call; parallel siblings share the same ppid.
      ---
         Up to 8 agents in ONE message, each `run_in_background: false`;
         more batches → next wave. `sessions` → `abort` their orphaned
         child sessions after collecting.
      3. The agent-less lines from step 2, then cross-task seams on top
         of the batch reports: two tasks touched
         the same file (the "independent" assumption was violated),
         duplicated code introduced by different workers, conflicting
         assumptions.
      4. Real findings: trivial → fix inline; substantial → first write
         one `review_base: <repo-abs-path>=<sha>` line per repo (same
         snapshot rule as `base:`, taken NOW) into the header, then append the findings as
         new `[ ]` task lines and → `refill` (the pick admits them like any
         other line). At most 3 visits — on the 3rd (the
         engine's `Revisit #3` header) no `refill`: fix inline or list what
         remains for the report as a human decision (a 4th entry throws).
      5. No findings → `done`.
    transitions:
      done: report
      refill: pick

  report:
    task: "Batch summary"
    prompt: |
      The queue is drained. Final pass:
      1. `sessions` → `abort` any remaining orphaned child sessions.
      2. Read {{context.queue_file}} and write the summary the user
         will actually read:
         - What the batch ACCOMPLISHED — outcomes grouped by theme,
           not a per-task echo of the queue.
         - Counts: done / failed / total; one line per `[!]` task with
           its reason; why the remaining `[ ]` lines were not admitted
           (the last pick's reasons: after:, ⏸, overlap, pause).
         - Review verdict (findings and how they were resolved, seams
           between tasks, or "clean").
         - Anything left unverified or needing a human decision.
      → `done`.
    transitions:
      done: finish

  finish:
    terminal: true
    outcome: complete
