name: subagent
description: "Workflow for sub-agents spawned by the Task tool. Routes to appropriate sub-workflow, completes task, and exits. No chat, planning, or reflection."
initial: route
max_transitions: 50

states:
  route:
    prompt: |
      You are a sub-agent with a specific assigned task.
      Route based on your task type — do NOT enter chat or planning mode.
      You have no interactive user: never take clarify/ask-user transitions
      inside sub-workflows — state your assumptions, proceed, and report
      uncertainty in the final answer.

      Analytical work (correctness depends on project skills, or it returns
      a judgement/recommendation) MUST take a skill-loaded path, never
      `execute`:
      - Read/understand/explore/verify code, blast-radius, recon, deep
        investigation → explore
      - Write/modify code → coding
      - Edit TEXT only — skill SKILL.md, workflow YAML prompts, CLAUDE.md,
        memory, reports, plans, README prose — with NO code file touched →
        docs (a doc edit that accompanies a code change stays in coding).
        When in doubt between docs and coding → coding.
      - Review or refactor code: refactoring (edits code) → coding;
        review-only (report findings, no edits) → explore
      - Debug/investigate an issue → debugging
      - Fix a known bug → bug_fix
      - Look up docs or web info → research
      - Run or write tests → testing
      - ONLY a genuinely trivial run-and-report task (one command, paste
        output verbatim, zero judgement) → execute
    transitions:
      coding: run_coding
      docs: run_docs
      explore: run_explore
      debugging: run_debugging
      bug_fix: run_bug_fix
      research: run_research
      testing: run_testing
      execute: execute

  execute:
    prompt: |
      Execute the assigned task directly. No sub-workflow needed.

      This leaf bypasses every skill gate. Honour whatever tooling/env
      constraints your spawn prompt specified (required CLIs, blocked
      commands). Strip noise, but quote every error, failing assertion,
      and number VERBATIM — don't paraphrase the signal or replace it
      with a verdict; the parent judges. Bash: run commands FOREGROUND
      with an explicit timeout sized to the command; background ONLY for
      never-exiting processes (servers, watchers) or runs over the
      10-min foreground ceiling.

      When done → transition `done`.
    transitions:
      done: done

  run_coding:
    sub_workflow: coding
    on_complete: done
    on_fail: failed

  run_docs:
    sub_workflow: docs
    on_complete: done
    on_fail: run_coding

  run_explore:
    sub_workflow: explore
    on_complete: done
    on_fail: failed

  run_debugging:
    sub_workflow: debugging
    on_complete: done
    on_fail: failed

  run_bug_fix:
    sub_workflow: bug-fix
    on_complete: done
    on_fail: failed

  run_research:
    sub_workflow: web-research
    on_complete: done
    on_fail: failed

  run_testing:
    sub_workflow: testing
    on_complete: done
    on_fail: failed

  done:
    terminal: true
    outcome: complete

  failed:
    terminal: true
    outcome: fail
