name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify version consistency
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "$PKG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION, plugin.json=$PLUGIN_VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test

  # What a new user gets: a fresh clone, `npm ci`, the build, the hook, the server, the docs' commands, in a temp
  # HOME (scripts/smoke-fresh-install.sh). About a minute on a cold cache.
  smoke-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm run smoke:fresh
