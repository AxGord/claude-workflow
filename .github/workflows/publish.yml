name: Publish to npm

on:
  push:
    branches: [master]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  # The suite does not run here: it ran, on every supported node, in ci.yml for this very commit. The gate waits for
  # that run (a push to master starts both workflows at once) and fails unless it is green; a dispatch is gated the
  # same way, on the commit of the ref it was dispatched from. One mechanism for both triggers: a workflow_run trigger
  # runs in master's context, needs the CI's head_sha threaded into every checkout, and does not cover a dispatch.
  ci-green:
    if: github.repository == 'AxGord/claude-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: CI is green for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/ci-green.sh "$GITHUB_SHA" "$GITHUB_REPOSITORY"

  publish:
    needs: ci-green
    if: github.repository == 'AxGord/claude-workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          # no registry-url: it injects a placeholder NODE_AUTH_TOKEN that blocks OIDC trusted publishing
      # Trusted publishing (OIDC) needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Verify version consistency
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "$PKG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION, plugin.json=$PLUGIN_VERSION"
            exit 1
          fi

      - name: Check for version bump
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists, skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version: $VERSION"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog
        if: steps.version.outputs.changed == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BODY=$(sh scripts/release-notes.sh "$VERSION")
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Build only: the tests are ci.yml's, and the gate above holds the release until they are green.
      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      # A re-run after a failure past the publish must reach the release commit: skip the publish when npm has the version
      - name: Check npm for this version
        if: steps.version.outputs.changed == 'true'
        id: npm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ "$(npm view "claude-mcp-workflow@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true' && steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public

      # After publish: a failed publish must not leave a branch or a tag behind (the version-bump check would skip forever).
      # A git-sourced install (the community catalog, this repository as a marketplace) copies the committed files and
      # never builds, so the tagged commit is master's release commit plus build/, pushed as the `release` branch.
      - name: Make the release commit
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.version.outputs.version }}"
          SHA=$(scripts/release-tree.sh --commit --message "Release v$VERSION (master $(git rev-parse --short HEAD) plus build/)")
          git push --force origin "$SHA:refs/heads/release"
          git tag "v$VERSION" "$SHA"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
